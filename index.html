  <link rel="icon" type="image/png" href="favicon.png">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <style id="splash-screen-style">
    :root {
      color-scheme: light dark;
      --loader-bg: #f7f7f7;
      --loader-ink: #171717;
      --loader-muted: #737373;
      --loader-line: #e5e5e5;
      --loader-mark-bg: #171717;
      --loader-mark-ink: #fafafa;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --loader-bg: #09090b;
        --loader-ink: #fafafa;
        --loader-muted: #a1a1aa;
        --loader-line: #27272a;
        --loader-mark-bg: #fafafa;
        --loader-mark-ink: #171717;
      }
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: var(--loader-bg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #splash {
      position: fixed;
      z-index: 9999;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 18%, rgba(16, 185, 129, 0.08), transparent 34%),
        radial-gradient(ellipse at 82% 78%, rgba(139, 92, 246, 0.07), transparent 32%),
        var(--loader-bg);
      color: var(--loader-ink);
      opacity: 1;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-12px);
    }

    .loader-mark {
      display: grid;
      width: 76px;
      height: 76px;
      place-items: center;
      border-radius: 25px;
      background: var(--loader-mark-bg);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.12);
      animation: mark-arrive 560ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .loader-mark svg {
      width: 39px;
      height: 39px;
      overflow: visible;
    }

    .loader-wordmark {
      margin-top: 21px;
      color: var(--loader-ink);
      font-size: 24px;
      font-weight: 750;
      letter-spacing: -1.15px;
    }

    .loader-status {
      margin-top: 7px;
      color: var(--loader-muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .loader-track {
      width: 116px;
      height: 3px;
      margin-top: 25px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--loader-line);
    }

    .loader-track::after {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #10b981, #06b6d4, #8b5cf6, #f59e0b);
      content: "";
      animation: loader-sweep 1.25s ease-in-out infinite;
    }

    .splash-exit {
      visibility: hidden;
      opacity: 0 !important;
      pointer-events: none;
    }

    @keyframes loader-sweep {
      from { transform: translateX(-110%); }
      to { transform: translateX(250%); }
    }

    @keyframes mark-arrive {
      from { opacity: 0; transform: translateY(8px) scale(0.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      const splash = document.getElementById("splash");
      if (splash) {
        splash.classList.add("splash-exit");
        window.setTimeout(() => splash.remove(), 200);
      }
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <div id="splash" role="status" aria-live="polite" aria-label="Ledgify 載入中">
    <div class="loader-content">
      <div class="loader-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 10.5h15l7 7v19a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2v-24a2 2 0 0 1 2-2Z" stroke="var(--loader-mark-ink)" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M28.5 11v7h7" stroke="var(--loader-mark-ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18 25h12" stroke="#10B981" stroke-width="2.8" stroke-linecap="round"/>
          <path d="M18 31h8" stroke="#8B5CF6" stroke-width="2.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="loader-wordmark">ledgify</div>
      <div class="loader-status">正在載入</div>
      <div class="loader-track" aria-hidden="true"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
